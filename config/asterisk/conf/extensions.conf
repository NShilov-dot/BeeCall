[general]
static = yes
writeprotect = no

[globals]
STASIS_APP = dograh

; Context for SIP softphones registered against this Asterisk.
; Dialing any 4-digit extension (8000-8999) hands the call to the
; Dograh Stasis app, where Dograh's ari_manager resolves the extension
; to the assigned workflow.
[from-internal]
exten => _8XXX,1,NoOp(Internal -> Stasis ${EXTEN})
 same => n,Answer()
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()

; Catch-all so a softphone can dial anything else and at least hear a
; reorder tone instead of getting an obscure CHANUNAVAIL.
exten => _X.,1,NoOp(No route for ${EXTEN})
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; Context for inbound calls from a SIP trunk (Beeline etc.). Same idea —
; dialled DID lands in Stasis(dograh) and Dograh picks the workflow.
[from-trunk]
exten => _X.,1,NoOp(Trunk -> Stasis ${EXTEN})
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()
