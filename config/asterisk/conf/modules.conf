[modules]
autoload = yes

; Modules we want guaranteed loaded for the Dograh ARI integration.
require = res_pjsip.so
require = res_ari.so
require = res_ari_channels.so
require = res_ari_bridges.so
require = res_ari_events.so
require = res_stasis.so
require = res_http_websocket.so
require = res_websocket_client.so
require = chan_websocket.so

; Disable noisy / unused channels in the container.
noload = chan_sip.so
noload = chan_mgcp.so
noload = chan_skinny.so
noload = chan_unistim.so
noload = chan_alsa.so
noload = chan_console.so
noload = chan_oss.so
