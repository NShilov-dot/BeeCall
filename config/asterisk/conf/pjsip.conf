; ---------------------------------------------------------------------------
; PJSIP — minimal config for local dev.
;
; Provides:
;   * One UDP transport on 5060 for softphone registration.
;   * One sample endpoint "6001" (password "6001") that a softphone
;     (Zoiper / Linphone) can register to and use to call extensions
;     in the [from-internal] dialplan context.
;
; Add more endpoints / a trunk to your operator (Beeline) when you're
; ready to go beyond local testing.
; ---------------------------------------------------------------------------

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Asterisk runs in a Docker container with its own IP (172.x). For a softphone
; on another LAN device, advertise the Mac's LAN IP so RTP/signaling come back
; to a reachable address (Docker port-forwards them into the container).
; If your Mac's LAN IP changes, update these. For a softphone on the Mac itself
; use 127.0.0.1 instead.
external_media_address = 192.168.1.35
external_signaling_address = 192.168.1.35

;
; Softphone endpoint 6001
;
[6001](!)
type = endpoint
context = from-internal
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[6001-auth]
type = auth
auth_type = userpass
username = 6001
password = 6001

[6001-aor]
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 60

[6001](6001)
auth = 6001-auth
aors = 6001-aor

; ---------------------------------------------------------------------------
; External SIP trunks (Zadarma, etc.) live in a gitignored include so the SIP
; password stays out of version control. Create config/asterisk/conf/
; pjsip_trunks.conf (see the Zadarma example there) before reloading.
; ---------------------------------------------------------------------------
#include pjsip_trunks.conf
