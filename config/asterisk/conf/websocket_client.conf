; chan_websocket / external media — Asterisk connects out to the Dograh api
; container over WebSocket. "dograh" is the connection name the api side
; passes via ARI externalMedia's external_host param.

[dograh]
type = websocket_client
uri = ws://api:8000/api/v1/telephony/ws/ari
protocols = media
; Reconnect every 5s if the api restarts; useful during local dev.
reconnect_interval = 5000
reconnect_attempts = -1
