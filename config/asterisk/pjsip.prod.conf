; ---------------------------------------------------------------------------
; PJSIP — PRODUCTION overlay.
;
; Mounted over /etc/asterisk/pjsip.conf by the `asterisk` service in
; docker-compose.yaml (profile `telephony`). Differs from the local-dev
; config/asterisk/conf/pjsip.conf in that it:
;   * advertises this host's PUBLIC/routable IP so remote softphones get
;     working two-way RTP audio, and
;   * ships NO sample softphone endpoint — you define your real endpoint(s)
;     with a strong password in the gitignored pjsip_trunks.conf.
;
; PJSIP does NOT expand ${ENV(...)} here (verified), so the IP below is a
; literal you must set. Lock 5060 to your testers' IPs at the host firewall.
; ---------------------------------------------------------------------------

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; >>> SET THIS to this host's public/routable IPv4 (same value as SERVER_IP in
; .env). Without it, remote softphones get an unroutable address in SDP and
; calls have one-way / no audio. Verify after start:
;   docker exec dograh-asterisk asterisk -rx "pjsip show transport transport-udp"
external_media_address = REPLACE_WITH_SERVER_PUBLIC_IP
external_signaling_address = REPLACE_WITH_SERVER_PUBLIC_IP

; ---------------------------------------------------------------------------
; Softphone / trunk endpoints — host-specific, kept OUT of git.
; Create config/asterisk/conf/pjsip_trunks.conf on the host and define your
; softphone endpoint(s) there with a STRONG password, e.g.:
;
;   [phone1-auth]
;   type = auth
;   auth_type = userpass
;   username = phone1
;   password = <long-random-secret>          ; NOT the username
;
;   [phone1-aor]
;   type = aor
;   max_contacts = 1
;   remove_existing = yes
;
;   [phone1]
;   type = endpoint
;   context = from-internal                   ; _8XXX -> Stasis(dograh)
;   disallow = all
;   allow = ulaw
;   allow = alaw
;   direct_media = no
;   rtp_symmetric = yes
;   force_rport = yes
;   rewrite_contact = yes
;   auth = phone1-auth
;   aors = phone1-aor
; ---------------------------------------------------------------------------
#include pjsip_trunks.conf
