# HTTP-only edge proxy for the dograh stack, sitting BEHIND an external TLS
# terminator (the Ansible-managed nginx on the gateway forwards
#   callcenter.buildx.uz  ->  http://<this-host>:80
# so TLS, the certificate and HTTP->HTTPS redirect all live on the gateway).
#
# It exists because the gateway proxies one backend per domain and cannot do
# the per-path split this app needs. Path split mirrors
# deploy/templates/nginx.remote.conf.template, minus TLS:
#
#   /api/v1/      -> api workers   (REST + long-lived WebSocket signaling)
#   /voice-audio/ -> MinIO         (call-recording playback)
#   /             -> Next.js UI    (also serves its own /api/config, /api/auth)
#
# Upstreams are docker service names on app-network, so api/ui/minio need no
# host port publishing for this to work.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Backend REST + WebSockets — bypass the UI, go straight to the api.
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # Retry on a dead/restarting worker
        proxy_next_upstream error timeout http_502 http_503 http_504;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Gateway terminates TLS; the browser's real scheme is https.
        proxy_set_header X-Forwarded-Proto https;

        # Long-lived WebSockets (audio streaming, signaling)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Don't buffer streamed responses
        proxy_buffering off;
    }

    location /voice-audio/ {
        proxy_pass http://minio:9000/voice-audio/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        client_max_body_size 100M;
    }

    location / {
        proxy_pass http://ui:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
