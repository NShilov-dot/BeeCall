services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # loopback only — the DB must never be reachable off-host. Containers
      # reach it over app-network by service name; this mapping is just for
      # host-local psql. (was "5432:5432" = every interface / public IP)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # loopback only — never expose Redis off-host
    command: >
      --requirepass redissecret
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redissecret", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:9000:9000" # Bind to localhost explicitly
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  dograh-init:
    image: bash:5.2
    container_name: dograh_init
    profiles: ["remote", "local-turn"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      SERVER_IP: "${SERVER_IP:-}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-http://localhost:8000}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-1}"
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./deploy:/workspace/deploy:ro
      - ./certs:/certs:ro
      - nginx-generated:/generated/nginx
      - coturn-generated:/generated/coturn
    command:
      - /workspace/scripts/run_dograh_init.sh

  nginx:
    image: nginx:alpine
    container_name: nginx_https
    restart: unless-stopped
    profiles: ["remote"]
    depends_on:
      dograh-init:
        condition: service_completed_successfully
      ui:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-generated:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - app-network

  coturn:
    image: coturn/coturn:4.8.0
    container_name: coturn
    restart: unless-stopped
    profiles: ["remote", "local-turn"]
    depends_on:
      dograh-init:
        condition: service_completed_successfully
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - coturn-generated:/etc/coturn:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
    networks:
      - app-network

  api:
    # Default registry is deliberately a local-only name: this fork's code exists
    # ONLY in images built here. If a stray `--pull always` (e.g. `remote_up.sh`
    # without `--build`) tries to fetch it, we want a loud "not found" rather
    # than a silent deploy of upstream Dograh images missing the BeeCall
    # services. Always start the remote stack with `./remote_up.sh --build`.
    image: ${REGISTRY:-beecall-local}/dograh-api:latest
    pull_policy: never
    restart: unless-stopped
    # Build from the repo root so `COPY pipecat` (Dockerfile:44) and `COPY ./api`
    # resolve — same context/args as `make build-api`. Lets `docker compose up
    # -d --build` rebuild the local tree instead of pulling the registry image.
    # Behind the corporate MITM proxy set INSECURE_BUILD=1 (in .env or inline).
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        INSECURE_BUILD: "${INSECURE_BUILD:-0}"
        PIPER_VOICES: "${PIPER_VOICES:-ru_RU-irina-medium}"
    volumes:
      - shared-tmp:/tmp
    environment:
      # Core application config
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      LOG_LEVEL: "INFO"

      # Replace this environment variable if you are using a custom
      # domain to host the stack
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-http://localhost:8000}"

      # Database configuration (using containerized postgres)
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/postgres"

      # Redis configuration (using containerized redis)
      REDIS_URL: "redis://:redissecret@redis:6379"

      # Storage configuration - using local MinIO
      ENABLE_AWS_S3: "false"

      # MinIO
      MINIO_ENDPOINT: "minio:9000"
      # Full URL (with scheme) browsers use to reach MinIO. For remote
      # deployments behind HTTPS, set MINIO_PUBLIC_ENDPOINT in .env to
      # e.g. https://your-server.example.com (nginx proxies /voice-audio/).
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"

      # Number of uvicorn worker processes (each is its own process bound to a
      # distinct port starting at 8000). dograh-init renders nginx upstreams
      # from this value and nginx load-balances across them with least_conn.
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-1}"

      # Number of arq background-job processes. Raise it if the job queue backs
      # up; nginx is not involved, so no config regeneration is needed.
      ARQ_WORKERS: "${ARQ_WORKERS:-1}"

      # Langfuse — credentials can be set here or per-organization via the UI
      # at /settings. Tracing is automatically active when credentials are
      # available; uncomment to set defaults for all organizations.
      # LANGFUSE_SECRET_KEY: ""
      # LANGFUSE_PUBLIC_KEY: ""
      # LANGFUSE_HOST: ""

      # TURN server configuration (for WebRTC NAT traversal in remote server)
      # Uses time-limited credentials via TURN REST API (HMAC-SHA1)
      TURN_HOST: "${TURN_HOST:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      FORCE_TURN_RELAY: "${FORCE_TURN_RELAY:-false}"

      # Seed keys for a new user's default stack (DeepSeek LLM + Deepgram STT +
      # Piper TTS). Piper needs no key; a missing key leaves that service unset
      # for the user to fill in under Model Configurations.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

      # REQUIRED — no insecure default. Anyone who knows the signing key can
      # forge a token for any account. setup_remote.sh generates one; for a
      # manual deploy put OSS_JWT_SECRET=$(openssl rand -hex 32) in .env.
      OSS_JWT_SECRET: "${OSS_JWT_SECRET:?set OSS_JWT_SECRET in .env — generate with: openssl rand -hex 32}"

      # Telemetry
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-false}"
      POSTHOG_API_KEY: "phc_ItizB1dP6yv7ZYobbcqrpxTdbomDA8hJFSEmAMdYvIr"
      POSTHOG_HOST: "https://us.i.posthog.com"

    ports:
      # loopback only — nginx load-balances across api:8000..api:8000+N-1 over
      # app-network, so publishing off-host would only expose the API without
      # TLS. Docker's iptables rules bypass ufw, so this must be closed here
      # rather than in the host firewall.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'').read()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  ui:
    # Same local-only default as api — see the comment there.
    image: ${REGISTRY:-beecall-local}/dograh-ui:latest
    pull_policy: never
    restart: unless-stopped
    # Build context is the repo root, matching `make build-ui` (ui/Dockerfile
    # does `COPY ui/...`). Without this block `--build` would rebuild api but
    # leave ui pulling a registry image, shipping a frontend without this
    # fork's code. INSECURE_BUILD is declared explicitly: unlike api, ui has no
    # other place to inherit it from.
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        INSECURE_BUILD: "${INSECURE_BUILD:-0}"
    environment:
      # Bind the Next.js standalone server to all interfaces. Docker otherwise
      # injects HOSTNAME=<container id> and Next binds only to that interface,
      # so the loopback healthcheck below fails ("unhealthy") even though the
      # published port works.
      HOSTNAME: "0.0.0.0"
      # Server-side URL (SSR, internal Docker network)
      BACKEND_URL: "${BACKEND_URL:-http://api:8000}"
      NODE_ENV: "oss"
      # Flag to enable/ disable posthog
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-false}"

      # Posthog
      POSTHOG_KEY: "phc_ItizB1dP6yv7ZYobbcqrpxTdbomDA8hJFSEmAMdYvIr"
      POSTHOG_HOST: "https://us.posthog.com"
    ports:
      # loopback only — nginx proxies `/` to ui:3010 over app-network.
      - "127.0.0.1:3010:3010"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1
          # first and the Next.js server binds IPv4 only, so the check fails
          # with "Connection refused" while the UI is perfectly up.
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3010 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # HTTP-only reverse proxy for running behind an EXTERNAL TLS terminator
  # (e.g. an Ansible-managed nginx on a separate gateway host that forwards
  # your-domain -> http://<this-host>:80). It does the per-path split the app
  # needs — /api/v1 (REST+WS) -> api, /voice-audio -> minio, everything else ->
  # ui — over app-network, so api/ui/minio need no host ports for it to work.
  #
  # Opt in with `--profile edge` (or COMPOSE_PROFILES=edge in .env). This is an
  # ALTERNATIVE to the `remote` profile's nginx — both bind :80, don't run both.
  # Also set MINIO_PUBLIC_ENDPOINT / BACKEND_API_ENDPOINT to https://your-domain
  # in .env so the api hands out public URLs, not localhost ones.
  edge:
    image: nginx:alpine
    container_name: dograh-edge
    profiles: ["edge"]
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/callcenter.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    # Opt-in only. This is an ANONYMOUS quick-tunnel that exposes the API on a
    # random public *.trycloudflare.com URL, bypassing nginx/TLS and any IP
    # allowlist. Start with `--profile cloudflare` only if you want that.
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate --url http://api:8000 --metrics 0.0.0.0:2000
    ports:
      - "2000:2000" # Expose metrics endpoint
    networks:
      - app-network

  # SIP telephony (Asterisk 22 + chan_websocket). Opt-in via `--profile
  # telephony`. Softphones (Zoiper/Linphone) register here; the media leg
  # streams to the api over app-network at ws://api:8000/.../ws/ari, and the
  # api drives call control via ARI at http://asterisk:8088 — internal to
  # app-network, deliberately NOT published to the host.
  #
  # Before first start on a prod host:
  #   1) set external_media_address in config/asterisk/pjsip.prod.conf to this
  #      host's public/routable IP (softphones need it for two-way audio),
  #   2) create config/asterisk/conf/pjsip_trunks.conf with your softphone
  #      endpoint(s) + a STRONG password (kept out of git),
  #   3) lock 5060 + 10000-10100/udp to your testers' IPs at the host firewall.
  asterisk:
    image: dograh/asterisk:22-local
    build:
      context: ./config/asterisk
      dockerfile: Dockerfile
    container_name: dograh-asterisk
    profiles: ["telephony"]
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./config/asterisk/conf:/etc/asterisk:ro
      # prod pjsip overlay: binds 0.0.0.0, advertises the public IP, and ships
      # no sample softphone (define real endpoints in pjsip_trunks.conf).
      - ./config/asterisk/pjsip.prod.conf:/etc/asterisk/pjsip.conf:ro
      - asterisk_lib:/var/lib/asterisk
      - asterisk_spool:/var/spool/asterisk
    ports:
      # Lock these to your testers' IPs at the host firewall / cloud security
      # group — do NOT leave SIP open to the whole internet.
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app-network

volumes:
  asterisk_lib:
  asterisk_spool:
  postgres_data:
  redis_data:
  minio-data:
    driver: local
  shared-tmp:
    driver: local
  nginx-generated:
    driver: local
  coturn-generated:
    driver: local

networks:
  app-network:
    driver: bridge
